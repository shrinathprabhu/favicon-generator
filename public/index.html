<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favicon Generator</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Favicon Generator</h1>
        <p>A simple sharp wrapper that generates favicon for your apps with a single SVG</p>
      </header>

      <form id="generator-form" action="/generate" method="post" enctype="multipart/form-data">
        <label for="appName">App name</label>
        <input id="appName" name="appName" type="text" autocomplete="organization" placeholder="My App" required>

        <label for="svg">SVG file</label>
        <input id="svg" name="svg" type="file" accept=".svg,image/svg+xml" required>

        <button type="submit">Generate ZIP</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
