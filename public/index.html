<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favicon Generator</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Favicon Generator</h1>
        <p>Generate complete favicon packages, platform icons, and web metadata from SVG, PNG, WebP, or other images directly in your browser.</p>
      </header>

      <form id="generator-form">
        <label for="appName">App name</label>
        <input id="appName" name="appName" type="text" autocomplete="organization" placeholder="My App" required>

        <label for="imageFile">Image file (SVG, PNG, WebP, JPEG)</label>
        <input id="imageFile" name="imageFile" type="file" accept=".svg,.png,.webp,.jpg,.jpeg,.avif,.gif,.ico,image/*" required>

        <button type="submit">Generate ZIP</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
